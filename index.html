<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LeaderSource</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;1,400&family=Montserrat:wght@500;600&family=Open+Sans:wght@400;600;700&display=swap">
<style>/* LeaderSource – sistema visual del prototipo.
   Concepto de layout: sobrio, académico, con espacios amplios; tres entornos (portal, campus, oficina) con el mismo encabezado y los mismos componentes. */
:root {
  --ls-deep: #173B5E;
  --ls-leader: #65A9D1;
  --ls-leader-ink: #2A6E99;
  --ls-sky: #A9D3E9;
  --ls-mist: #EAF3F8;
  --ls-gray: #657481;
  --ls-gray-mist: #536471;
  --ls-white: #FFFFFF;

  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-alt: #EAF3F8;
  --fg: #173B5E;
  --fg-body: #24384A;
  --fg-soft: #657481;
  --fg-soft-alt: #536471;
  --line: #D3E0E9;
  --link: #2A6E99;
  --accent: #65A9D1;
  --accent-soft: #A9D3E9;
  --btn-bg: #173B5E;
  --btn-fg: #FFFFFF;
  --hero-bg: #173B5E;
  --hero-fg: #FFFFFF;
  --hero-soft: #C9DEEC;
  --ok: #1F6B4A;
  --ok-bg: #E3F2EA;
  --warn: #8A5A00;
  --warn-bg: #FBF0D9;
  --bad: #A12B2B;
  --bad-bg: #F8E5E5;
  --focus: #173B5E;

  --font-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-body: "Open Sans", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Merriweather", Georgia, "Times New Roman", serif;

  --r-card: 10px;
  --r-ctl: 8px;
  --gutter: 24px;
  --maxw: 1200px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E2236; --surface: #16304A; --surface-alt: #122A41;
    --fg: #E7EEF4; --fg-body: #D5E0E9; --fg-soft: #9AA9B5; --fg-soft-alt: #9AA9B5;
    --line: #2A4560; --link: #8FC3E3; --accent: #65A9D1; --accent-soft: #2D5878;
    --btn-bg: #8FC3E3; --btn-fg: #0E2236; --hero-bg: #0A1A2A; --hero-fg: #F2F7FB; --hero-soft: #B7CCDB;
    --ok: #7FD1A8; --ok-bg: #153A2B; --warn: #E8BE6A; --warn-bg: #3B2D10; --bad: #F0A0A0; --bad-bg: #401A1A;
    --focus: #8FC3E3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E2236; --surface: #16304A; --surface-alt: #122A41;
  --fg: #E7EEF4; --fg-body: #D5E0E9; --fg-soft: #9AA9B5; --fg-soft-alt: #9AA9B5;
  --line: #2A4560; --link: #8FC3E3; --accent: #65A9D1; --accent-soft: #2D5878;
  --btn-bg: #8FC3E3; --btn-fg: #0E2236; --hero-bg: #0A1A2A; --hero-fg: #F2F7FB; --hero-soft: #B7CCDB;
  --ok: #7FD1A8; --ok-bg: #153A2B; --warn: #E8BE6A; --warn-bg: #3B2D10; --bad: #F0A0A0; --bad-bg: #401A1A;
  --focus: #8FC3E3; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--fg-body);
  font: 400 1rem/1.65 var(--font-body);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--fg); margin: 0; text-wrap: balance; }
h1 { font-weight: 600; font-size: clamp(2rem, 4.4vw, 3.1rem); line-height: 1.12; letter-spacing: -0.01em; }
h2 { font-weight: 600; font-size: clamp(1.5rem, 2.6vw, 2rem); line-height: 1.2; }
h3 { font-weight: 500; font-size: 1.25rem; line-height: 1.3; }
h4 { font-weight: 500; font-size: 1.05rem; line-height: 1.35; }
p { margin: 0; max-width: 68ch; }
a { color: var(--link); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
img, svg { max-width: 100%; }
.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--btn-bg); color: var(--btn-fg); padding: 10px 16px; border-radius: var(--r-ctl); z-index: 100; }
.skip:focus { top: 8px; }

.wrap { width: 100%; max-width: calc(var(--maxw) + 2 * var(--gutter)); margin-inline: auto; padding-inline: max(16px, var(--gutter)); }
.section { padding-block: clamp(56px, 8vw, 96px); }
.section.alt { background: var(--surface-alt); }
.section-head { display: grid; gap: 12px; margin-bottom: 40px; }
.section-head p { color: var(--fg-soft); }
.eyebrow { font: 600 0.75rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-soft-alt); }
.alt .eyebrow { color: var(--fg-soft-alt); }
.grid { display: grid; gap: 24px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.stack { display: grid; gap: 16px; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.muted { color: var(--fg-soft); }
.nowrap { white-space: nowrap; }
[hidden] { display: none !important; }

/* Marcador de estado del prototipo */
.protobar { background: var(--ls-deep); color: #fff; font-size: 0.8125rem; }
:root[data-theme="dark"] .protobar { background: #07131F; }
.protobar .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding-block: 8px; }
.protobar a { color: #fff; font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 600 0.6875rem/1 var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.tag.demo { color: var(--warn); background: var(--warn-bg); }
.tag.f3 { color: var(--fg-soft-alt); background: var(--surface-alt); }
.tag.real { color: var(--ok); background: var(--ok-bg); }
.protobar .tag { border-color: rgba(255,255,255,.55); background: transparent; color: #fff; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border-radius: var(--r-ctl); border: 2px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font: 600 0.9375rem/1.2 var(--font-body); text-decoration: none; cursor: pointer; transition: background-color .15s, color .15s, border-color .15s; }
.btn:hover { background: var(--ls-leader); border-color: var(--ls-leader); color: #0E2236; }
.btn.sec { background: transparent; color: var(--fg); border-color: var(--fg); }
.btn.sec:hover { background: var(--accent-soft); border-color: var(--fg); color: var(--fg); }
.btn.txt { background: transparent; border-color: transparent; color: var(--link); padding-inline: 8px; }
.btn.txt:hover { background: var(--surface-alt); color: var(--link); border-color: transparent; }
.btn.on-dark { background: #fff; border-color: #fff; color: #173B5E; }
.btn.on-dark:hover { background: var(--ls-leader); border-color: var(--ls-leader); }
.btn.sec.on-dark { background: transparent; color: #fff; border-color: #fff; }
.btn.sec.on-dark:hover { background: rgba(255,255,255,.14); color: #fff; }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 0.875rem; }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--surface-alt); border-color: var(--line); color: var(--fg-soft-alt); cursor: not-allowed; }
.btn[disabled]:hover { background: var(--surface-alt); border-color: var(--line); color: var(--fg-soft-alt); }

/* Formularios */
label, .label { display: block; font: 600 0.875rem/1.3 var(--font-body); color: var(--fg); margin-bottom: 6px; }
input[type="text"], input[type="search"], input[type="email"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--r-ctl); border: 1.5px solid var(--fg-soft); background: var(--surface); color: var(--fg-body); font: 400 1rem/1.4 var(--font-body);
}
textarea { min-height: 110px; resize: vertical; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--ls-deep); margin: 0; flex: none; }
:root[data-theme="dark"] input[type="checkbox"], :root[data-theme="dark"] input[type="radio"] { accent-color: #8FC3E3; }
.check { display: flex; align-items: flex-start; gap: 10px; font-weight: 400; color: var(--fg-body); margin: 0; padding: 6px 0; cursor: pointer; }
.field { display: grid; gap: 4px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font: 600 0.875rem/1.3 var(--font-body); color: var(--fg); padding: 0; margin-bottom: 6px; }

/* Tarjetas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 24px; min-width: 0; }
.card.mist { background: var(--surface-alt); }
.card.link { text-decoration: none; color: inherit; display: grid; gap: 12px; align-content: start; transition: border-color .15s, transform .15s; }
.card.link:hover { border-color: var(--accent); }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 0.75rem/1.2 var(--font-body); background: var(--surface-alt); color: var(--fg-soft-alt); border: 1px solid var(--line); white-space: nowrap; }
.chip.stage { background: var(--accent-soft); color: var(--fg); border-color: transparent; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.pub { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.priv { background: var(--surface-alt); color: var(--fg); border-color: var(--line); }
.ico-box { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--fg); display: grid; place-items: center; font-size: 1.25rem; }
.ico-box .icon { width: 24px; height: 24px; }

/* Marcador de fotografía */
.ph { position: relative; display: grid; place-items: center; text-align: center; padding: 20px; min-height: 220px; border: 1.5px dashed var(--accent); border-radius: var(--r-card); background:
  repeating-linear-gradient(135deg, transparent 0 14px, rgba(101,169,209,.12) 14px 15px); color: var(--fg-soft-alt); font-size: 0.8125rem; }
.ph strong { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 500; margin-bottom: 4px; font-size: 0.9375rem; }
.hero .ph { color: var(--hero-soft); border-color: rgba(255,255,255,.45); background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,.07) 14px 15px); }
.hero .ph strong { color: #fff; }

/* Cabecera pública */
.site-header { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; gap: 16px; min-height: 68px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font: 600 1.25rem/1 var(--font-display); letter-spacing: -0.01em; }
.brand b { font-weight: 500; color: var(--link); }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ls-deep); display: grid; place-items: center; }
.brand .mark svg { width: 18px; height: 18px; fill: none; stroke: #A9D3E9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:root[data-theme="dark"] .brand .mark { background: #1E4465; }
.nav { display: flex; gap: 2px; margin-left: auto; align-items: center; }
.nav a { color: var(--fg); text-decoration: none; padding: 10px 12px; border-radius: var(--r-ctl); font-size: 0.9375rem; font-weight: 600; white-space: nowrap; }
.nav a:hover { background: var(--surface-alt); }
.nav a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--accent); border-radius: 0; }
.nav .btn { color: var(--btn-fg); margin-left: 8px; }
.nav .btn:hover { color: #0E2236; }
.menu-btn { display: none; margin-left: auto; }
@media (max-width: 1060px) {
  .menu-btn { display: inline-flex; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--bg); border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 12px max(16px, var(--gutter)) 20px; margin: 0; }
  .nav.open { display: flex; }
  .nav a { padding: 12px; }
  .nav .btn { margin: 8px 0 0; }
  .site-header .wrap { position: relative; }
}

/* Héroe */
.hero { background: var(--hero-bg); color: var(--hero-fg); }
.hero h1 { color: var(--hero-fg); }
.hero .lead { color: var(--hero-soft); font-size: 1.125rem; max-width: 56ch; }
.hero .eyebrow { color: var(--ls-sky); }
.hero-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; padding-block: clamp(48px, 7vw, 88px); }
.hero-grid > * { min-width: 0; }
@media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; } }
.page-head { background: var(--surface-alt); border-bottom: 1px solid var(--line); }
.page-head .wrap { padding-block: clamp(32px, 5vw, 56px); display: grid; gap: 12px; }
.page-head p { color: var(--fg-soft-alt); font-size: 1.0625rem; }

/* Cita Merriweather */
.quote { font-family: var(--font-serif); font-size: clamp(1.1rem, 2vw, 1.375rem); line-height: 1.65; color: var(--fg); border-left: 4px solid var(--accent); padding: 4px 0 4px 24px; margin: 0; max-width: 62ch; }
.quote cite { display: block; margin-top: 12px; font: 600 0.875rem/1.3 var(--font-body); font-style: normal; color: var(--fg-soft-alt); }
.quote.italic p { font-style: italic; }

/* Estrategia */
.principle { display: grid; gap: 12px; align-content: start; }
.principle .num { font: 600 0.75rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft-alt); }
.action { display: grid; gap: 8px; align-content: start; padding: 20px; }
.action h4 { display: flex; align-items: center; gap: 10px; }
.action p { font-size: 0.9375rem; color: var(--fg-soft-alt); }
.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; counter-reset: st; list-style: none; padding: 0; margin: 0; }
.stages li { position: relative; padding: 0 16px 0 0; display: grid; gap: 8px; align-content: start; }
.stages .dot { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); display: grid; place-items: center; font: 600 0.9375rem/1 var(--font-display); color: var(--fg); position: relative; z-index: 1; }
.stages li::before { content: ""; position: absolute; top: 19px; left: 40px; right: 0; height: 2px; background: var(--accent-soft); }
.stages li:last-child::before { display: none; }
.stages li:hover .dot, .stages li:focus-within .dot { background: var(--accent-soft); }
@media (max-width: 760px) {
  .stages { grid-template-columns: 1fr; gap: 20px; }
  .stages li { padding: 0 0 0 56px; }
  .stages .dot { position: absolute; left: 0; top: 0; }
  .stages li::before { top: 40px; left: 19px; width: 2px; height: calc(100% + 0px); right: auto; }
}

/* Catálogo */
.catalog { display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start; }
.catalog > * { min-width: 0; }
@media (max-width: 900px) { .catalog { grid-template-columns: 1fr; } }
.filters { display: grid; gap: 20px; position: sticky; top: 92px; }
@media (max-width: 900px) { .filters { position: static; } }
.course-card { display: grid; gap: 12px; align-content: start; height: 100%; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--fg-soft); font-size: 0.8125rem; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.card .meta { color: var(--fg-soft); }
.card.mist .meta { color: var(--fg-soft-alt); }

/* App shell */
.app { display: grid; grid-template-columns: 264px 1fr; min-height: calc(100vh - 100px); }
.app > * { min-width: 0; }
.sidebar { background: var(--ls-deep); color: #fff; padding: 20px 14px; display: grid; gap: 4px; align-content: start; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
:root[data-theme="dark"] .sidebar { background: #0A1A2A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sidebar { background: #0A1A2A; } }
.sidebar .brand { color: #fff; padding: 4px 8px 16px; }
.sidebar .brand b { color: var(--ls-sky); }
.sidebar .brand .mark { background: rgba(255,255,255,.12); }
.sidebar h2 { font: 600 0.6875rem/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ls-sky); padding: 16px 10px 6px; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-ctl); color: #fff; text-decoration: none; font-size: 0.9375rem; font-weight: 600; }
.sidebar a:hover { background: rgba(255,255,255,.1); }
.sidebar a[aria-current="page"] { background: rgba(169,211,233,.2); box-shadow: inset 3px 0 0 var(--ls-sky); }
.sidebar :focus-visible { outline-color: #fff; }
.sidebar .role-box { margin-top: 12px; padding: 12px; border-radius: var(--r-card); background: rgba(255,255,255,.08); display: grid; gap: 6px; }
.sidebar .role-box label { color: #fff; margin: 0; font-size: 0.75rem; }
.sidebar .role-box select { min-height: 40px; background: #fff; color: #173B5E; border-color: #fff; }
.sidebar .role-box small { color: #C9DEEC; font-size: 0.75rem; line-height: 1.4; }
.app-main { min-width: 0; }
.app-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px max(16px, var(--gutter)); border-bottom: 1px solid var(--line); background: var(--bg); }
.app-top .crumbs { font-size: 0.875rem; color: var(--fg-soft); }
.app-top .crumbs a { color: var(--link); }
.app-body { padding: clamp(20px, 3vw, 40px) max(16px, var(--gutter)) 72px; display: grid; gap: 28px; align-content: start; max-width: 1280px; }
.app-body > * { min-width: 0; }
.app-head { display: grid; gap: 8px; }
.app-head p { color: var(--fg-soft); }
.drawer-btn { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); height: auto; transform: translateX(-102%); transition: transform .2s; padding-top: max(20px, env(safe-area-inset-top, 0px)); }
  .sidebar.open { transform: none; }
  .drawer-btn { display: inline-flex; }
  .scrim { position: fixed; inset: 0; background: rgba(7,19,31,.55); z-index: 40; }
}

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
.kpi { display: grid; gap: 4px; padding: 18px 20px; }
.kpi .n { font: 600 2rem/1 var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 0.875rem; color: var(--fg-soft); }
.card.mist .l { color: var(--fg-soft-alt); }

.progress { height: 10px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.card.mist .progress { background: var(--surface); }
.pbar { display: grid; gap: 6px; }
.pbar .top { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--fg-soft); font-variant-numeric: tabular-nums; }

/* Tablas */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
caption { text-align: left; padding: 14px 16px; font: 500 1rem/1.3 var(--font-display); color: var(--fg); }
th, td { text-align: left; padding: 12px 16px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--surface-alt); color: var(--fg); font: 600 0.75rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .06em; border-top: 0; white-space: nowrap; }
tbody tr:hover { background: var(--surface-alt); }
tbody tr.sel { background: var(--accent-soft); }

function catFiltered() {
  const f = S.cat, q = f.q.trim().toLowerCase();
  return COURSES.filter(c => (!q || (c.title + ' ' + c.summary).toLowerCase().includes(q))
    && (!f.stage.length || f.stage.includes(c.stage))
    && (!f.action.length || c.actions.some(a => f.action.includes(a)))
    && (!f.format.length || f.format.includes(c.format))
    && (!f.level.length || f.level.includes(c.level))
    && (!f.mod.length || f.mod.includes(c.modality)));
}
function catGroup(key, legend, opts) {
  return `<fieldset><legend>${legend}</legend>${opts.map(([v, l]) => `<label class="check"><input type="checkbox" data-cat="${key}" value="${esc(v)}" ${S.cat[key].includes(v) ? 'checked' : ''}> <span>${esc(l)}</span></label>`).join('')}</fieldset>`;
}
function catResults() {
  const r = catFiltered();

}

function viewCampus() {

    const open = mine.filter(m => m.pct < 100);
    const nextCourse = open[0];
    const nextLesson = nextCourse ? allLessons(nextCourse.c).find(l => !S.done[l.key]) : null;
    const stageIdx = STAGES.findIndex(s => s.code === p.stage);
    return `
    <div class="app-head"><span class="eyebrow">Campus virtual ${tagDemo}</span><h1 id="h-camp" tabindex="-1">Mi aprendizaje</h1><p>Hola, ${esc(p.name.split(' ')[0])}. Esta es su trayectoria de formación.</p></div>

      <ol class="stages">${STAGES.map((s, i) => `<li><span class="dot" ${i === stageIdx ? 'style="background:var(--accent);border-color:var(--accent);color:#0E2236"' : ''}>${i < stageIdx ? ic('check') : i + 1}</span><strong style="color:var(--fg);font-family:var(--font-display)">${esc(s.en)}</strong>${i === stageIdx ? '<span class="chip stage">Etapa actual</span>' : ''}</li>`).join('')}</ol></section>
    ${nextCourse ? `<section class="card mist stack" aria-labelledby="h-cont"><span class="eyebrow">Continuar donde lo dejó</span><h2 id="h-cont" style="font-size:1.375rem">${esc(nextCourse.c.title)}</h2><p>Siguiente: ${esc(nextLesson.title)}</p>${bar(nextCourse.pct)}<div><a class="btn" href="#leccion-${nextCourse.c.id}-${nextLesson.mi}-${nextLesson.li}">Continuar ${ic('right')}</a></div></section>` : ''}
    <section aria-labelledby="h-asig"><h2 id="h-asig" style="font-size:1.25rem;margin-bottom:16px">Mis cursos</h2>

  </div>`;
}

const NATIVE = {
  '1-1-1': `<p>Bienvenida. Este curso es una primera conversación sobre qué significa servir como líder cuando Cristo ocupa el centro. No es un curso de técnicas. Es un recorrido para pensar, orar y conversar con otros participantes.</p><h3>Qué va a encontrar</h3><p>Tres módulos cortos, con lecturas, una reflexión personal, un recorrido interactivo y una evaluación final. Puede avanzar a su ritmo y volver a cualquier lección.</p><div class="notice">${ic('info')}<p>Texto de ejemplo para la maqueta. El contenido real lo prepara el equipo de formación.</p></div>`,
  '1-1-2': `<p>Cuando decimos que Cristo es el centro, no hablamos de un tema que se agrega a la formación. Hablamos de la medida con que se evalúa todo lo demás: lo que se enseña, cómo se enseña y para qué se forma al líder.</p>
    <figure class="quote italic" style="margin:8px 0"><p>Y él es la cabeza del cuerpo que es la iglesia, él que es el principio, el primogénito de entre los muertos, para que en todo tenga la preeminencia.</p><cite>Colosenses 1:18 (RVR1960)</cite></figure>
    <h3>Tres preguntas para pensar</h3><p>¿Qué decisiones de su ministerio se toman hoy sin mirar a Cristo? ¿Qué cambiaría si Él fuera el criterio? ¿A quién necesita escuchar para verlo con más claridad?</p>
    <div class="notice">${ic('info')}<p>Texto de ejemplo para la maqueta.</p></div>`
};
const genericNative = l => `<p>Contenido de ejemplo para la lección «${esc(l.title)}». En el campus real, esta zona muestra el texto, las imágenes y los recursos que prepare el instructor desde el editor de cursos.</p><p>Una lección nativa admite texto con formato, citas, imágenes, vídeo incrustado de origen permitido y documentos descargables.</p><div class="notice">${ic('info')}<p>Contenido ficticio.</p></div>`;

function viewLeccion(cid, mi, li) {
  const c = course(cid);
  const m = c && c.modules[mi - 1], l = m && m.lessons[li - 1];

  const prev = ls[idx - 1], next = ls[idx + 1], key = ls[idx].key, done = !!S.done[key];

  else body = `<form class="quiz" id="quiz" onsubmit="return false" aria-label="Cuestionario">${QUIZ.map((q, i) => `<fieldset class="q" id="q${i}"><legend>${i + 1}. ${esc(q.q)}</legend>${q.o.map((o, j) => `<label class="check"><input type="radio" name="q${i}" value="${j}"> <span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<div class="row"><button class="btn" type="submit" id="quiz-go">Comprobar respuestas</button><span id="quiz-out" role="status" aria-live="polite"></span></div><p class="muted" style="font-size:.875rem">Nota mínima para aprobar: 70 %. El resultado se guarda solo en este navegador.</p></form>`;

      ${body}

      <div class="lesson-nav">
        ${prev ? `<a class="btn sec" href="#leccion-${c.id}-${prev.mi}-${prev.li}">${ic('left')} Anterior</a>` : '<span></span>'}
        <button type="button" class="btn ${done ? 'sec' : ''}" id="toggle-done" aria-pressed="${done}">${done ? ic('check') + ' Completada. Deshacer' : 'Marcar como completada'}</button>
        ${next ? `<a class="btn sec" href="#leccion-${c.id}-${next.mi}-${next.li}">Siguiente ${ic('right')}</a>` : `<a class="btn sec" href="#curso-${c.id}">Terminar</a>`}

    </div>
  </div>`;
}

/* ---------- Oficina virtual: documentos ---------- */

function viewExpediente(id) {

  if (!p) return denied('este expediente');
  if (!visiblePeople().includes(p)) return denied('este expediente');
  const showNotes = !['participante', 'instructor'].includes(S.role);
  const tabs = [['datos', 'Datos'], ['cap', 'Capacitaciones'], ['docs', 'Documentos'], ['cert', 'Certificaciones']].concat(showNotes ? [['obs', 'Observaciones internas']] : []);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'datos';
  return `
  <div class="app-head"><div class="crumbs"><a href="#participantes">Participantes</a> / ${esc(p.name)}</div>

    <h1 id="h-exp" tabindex="-1" style="font-size:clamp(1.75rem,3.4vw,2.5rem)">${esc(p.name)}</h1><p>${esc(p.org)} · ${esc(p.country)}</p></div>

function expTab(p) {
  const t = S.tab;

    <div class="card stack"><h2 style="font-size:1.0625rem">Etapa de desarrollo</h2><ol class="stages v">${STAGES.map((s, i) => { const cur = STAGES.findIndex(x => x.code === p.stage); return `<li><span class="dot" ${i === cur ? 'style="background:var(--accent);border-color:var(--accent);color:#0E2236"' : ''}>${i < cur ? ic('check') : i + 1}</span><strong style="color:var(--fg)">${esc(s.en)}</strong>${i === cur ? ' <span class="chip stage">Actual</span>' : ''}<span class="muted" style="font-size:.875rem;display:block">${esc(s.es)}</span></li>`; }).join('')}</ol></div></div>`;

  if (t === 'docs') { const ds = DOCS.filter(d => d.parts.includes(p.id) && visibleDocs().includes(d)); return ds.length ? `<div class="tablewrap"><table><caption class="sr-only">Documentos asociados</caption><thead><tr><th scope="col">Documento</th><th scope="col">Categoría</th><th scope="col">Actualizado</th><th scope="col"><span class="sr-only">Acciones</span></th></tr></thead><tbody>${ds.map(d => `<tr><td>${esc(d.title)}<small>${esc(d.ref)}</small></td><td>${esc(d.cat)}</td><td class="nowrap">${fmtDate(d.updated)}</td><td>${disabledBtn('Descargar', 'Fase 3', '', 'download')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card"><p class="muted">No hay documentos asociados visibles para este rol.</p></div>'; }
  if (t === 'cert') return p.certs.length ? `<div class="card"><ul class="list-plain">${p.certs.map(c => `<li><div><strong style="color:var(--fg)">${esc(course(c[0]).title)}</strong><small>${esc(c[1])} · ${fmtDate(c[2])} · Código de verificación ${esc(c[3])}</small></div>${disabledBtn('Descargar', 'Fase 3', '', 'download')}</li>`).join('')}</ul></div>` : '<div class="card"><p class="muted">Aún no tiene certificaciones.</p></div>';
  return `<div class="split"><div class="card stack">${p.notes.length ? `<ol class="timeline">${p.notes.map(n => `<li><strong style="color:var(--fg)">${fmtDate(n[0])}</strong><small>${esc(n[1])}</small>${esc(n[2])}</li>`).join('')}</ol>` : '<p class="muted">Sin observaciones.</p>'}</div><div class="card stack"><div class="field"><label for="obs">Nueva observación interna</label><textarea id="obs" disabled></textarea></div><div>${disabledBtn('Guardar observación', 'Fase 3')}</div></div></div>`;

/* Estructura de página, enrutador por hash y eventos. */
const root = document.getElementById('root');
const TITLES = { inicio: 'Inicio', estrategia: 'Estrategia', formacion: 'Catálogo de formación', recursos: 'Repositorio público', contacto: 'Contacto', acceso: 'Acceso', estado: 'Estado del prototipo', campus: 'Campus virtual', oficina: 'Oficina virtual: documentos', participantes: 'Participantes', solicitudes: 'Solicitudes', admin: 'Panel administrativo', reportes: 'Reportes administrativos', 'quienes-somos': 'Quiénes somos', publicaciones: 'Publicaciones', historias: 'Historias y testimonios', curso: 'Vista de curso', leccion: 'Lección', expediente: 'Expediente individual' };

function protobar() {
  return `<div class="protobar" role="note"><div class="wrap"><span class="tag">Prototipo</span><span>Datos ficticios. No hay servidor: nada se guarda ni se envía.</span><a href="#estado">Qué es real y qué es demostración</a></div></div>`;
}
function themeBtn() {
  const dark = effTheme() === 'dark';
  return `<button type="button" class="theme-btn" data-theme-toggle aria-label="Cambiar a tema ${dark ? 'claro' : 'oscuro'}">${ic('sun')} ${dark ? 'Tema claro' : 'Tema oscuro'}</button>`;
}
function effTheme() { const t = document.documentElement.getAttribute('data-theme'); if (t) return t; return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }

function publicShell(name, html) {
  const cur = { 'curso': 'formacion' }[name] || name;
  return `<a class="skip" href="#main" data-skip>Saltar al contenido</a>${protobar()}
  <header class="site-header"><div class="wrap">${brand()}
    <button type="button" class="btn sec sm menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav">${ic('menu')} Menú</button>
    <nav class="nav" id="nav" aria-label="Principal">${PUB_NAV.map(([h, l]) => `<a href="#${h}" ${cur === h ? 'aria-current="page"' : ''}>${l}</a>`).join('')}<a class="btn sm" href="#acceso">Acceder</a></nav></div></header>
  <main id="main">${html}</main>
  <footer class="site-footer"><div class="wrap">
    <div class="grid g4"><div class="stack">${brand()}<p style="font-size:.9375rem">Desarrollo de líderes, iglesias y ministerios.</p></div>
      <div><h2>Portal</h2><ul>${PUB_NAV.slice(1).map(([h, l]) => `<li><a href="#${h}">${l}</a></li>`).join('')}</ul></div>
      <div><h2>Plataforma</h2><ul><li><a href="#acceso">Campus virtual</a></li><li><a href="#acceso">Oficina virtual</a></li><li><a href="#estado">Estado del prototipo</a></li></ul></div>
      <div><h2>Contacto</h2><ul><li>contacto@leadersource.example</li><li>Datos de ejemplo</li></ul></div></div>
    <div class="footer-note"><span>© 2026 LeaderSource. Prototipo con contenido provisional.</span><span>${themeBtn()}</span></div></div></footer>`;
}

function sidebar(name) {
  const items = [];
  const add = (grp, h, label, icon, show = true) => { if (show) items.push({ grp, h, label, icon }); };
  const campusLabel = S.role === 'participante' ? 'Mi aprendizaje' : S.role === 'instructor' ? 'Mis cursos' : 'Gestión de programas';
  add('Campus', 'campus', campusLabel, 'book', can('Campus: mi aprendizaje') || can('Campus: gestión de cursos'));
  add('Campus', 'formacion', 'Catálogo', 'layers');
  add('Oficina virtual', 'oficina', 'Documentos', 'folder');
  add('Oficina virtual', 'participantes', 'Participantes', 'users', can('Oficina: participantes y expedientes'));
  add('Oficina virtual', 'solicitudes', 'Solicitudes', 'clip', can('Oficina: solicitudes'));
  add('Oficina virtual', 'reportes', 'Reportes', 'chart', can('Reportes administrativos'));
  add('Administración', 'admin', 'Panel administrativo', 'sliders', ['superadmin', 'director', 'coordinador'].includes(S.role));
  add('Entornos', 'inicio', 'Portal público', 'globe');
  add('Entornos', 'estado', 'Estado del prototipo', 'info');
  const curN = { curso: 'campus', leccion: 'campus', expediente: 'participantes' }[name] || name;
  let out = '', g = '';
  items.forEach(i => { if (i.grp !== g) { g = i.grp; out += `<h2>${g}</h2>`; } out += `<a href="#${i.h}" ${curN === i.h ? 'aria-current="page"' : ''}>${ic(i.icon)} ${i.label}</a>`; });
  return `<aside class="sidebar" id="sidebar" aria-label="Navegación de la plataforma">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">${brand('#campus')}<button type="button" class="btn sec sm on-dark drawer-btn" data-drawer-close aria-label="Cerrar menú">${ic('x')}</button></div>
    <nav aria-label="Módulos disponibles para su rol">${out}</nav>
    <div class="role-box"><label for="role-sel">Rol de demostración</label><select id="role-sel">${ROLES.map(r => `<option value="${r.id}" ${r.id === S.role ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select><small>Selector solo para revisar el diseño. En producción el rol viene de la sesión y la API decide el acceso.</small></div>
  </aside>`;
}
function appShell(name, html, bare) {
  return `<a class="skip" href="#main" data-skip>Saltar al contenido</a>${protobar()}
  <div class="app">${sidebar(name)}<div class="app-main">
    <div class="app-top"><div class="row"><button type="button" class="btn sec sm drawer-btn" data-drawer-open aria-controls="sidebar" aria-expanded="false">${ic('menu')} Menú</button><span class="crumbs">${esc(curRole().person)} · ${esc(curRole().name)}</span></div><div class="row">${themeBtn()}</div></div>
    <main id="main" ${bare ? '' : 'class="app-body"'}>${html}</main></div></div>`;
}

/* Rutas */
function resolve() {
  const h = (location.hash || '#inicio').replace(/^#/, '') || 'inicio';
  let m;
  const pub = (name, html) => ({ name, env: 'pub', html });
  const app = (name, html, bare) => ({ name, env: 'app', html, bare });
  switch (true) {
    case h === 'inicio': return pub('inicio', viewInicio());
    case h === 'estrategia': return pub('estrategia', viewEstrategia());
    case h === 'formacion': return pub('formacion', viewFormacion());
    case h === 'recursos': return pub('recursos', viewRecursos());
    case h === 'contacto': return pub('contacto', viewContacto());
    case h === 'acceso': return pub('acceso', viewAcceso());
    case h === 'estado': return pub('estado', viewEstado());
    case h in STUBS && h !== 'reportes': return pub(h, viewStub(...STUBS[h]));
    case h === 'campus': return app('campus', can('Campus: mi aprendizaje') || can('Campus: gestión de cursos') ? viewCampus() : denied('el campus de aprendizaje'));
    case (m = h.match(/^curso-(\d+)$/)) !== null: return app('curso', viewCurso(m[1]));
    case (m = h.match(/^leccion-(\d+)-(\d+)-(\d+)$/)) !== null: return (can('Campus: mi aprendizaje') || can('Campus: gestión de cursos')) ? app('leccion', viewLeccion(+m[1], +m[2], +m[3]), true) : app('leccion', denied('las lecciones del campus'));
    case h === 'oficina': return app('oficina', viewOficina());
    case h === 'participantes': return app('participantes', can('Oficina: participantes y expedientes') ? viewParticipantes() : denied('los expedientes de participantes'));
    case (m = h.match(/^expediente-(\d+)$/)) !== null: return app('expediente', viewExpediente(m[1]));
    case h === 'solicitudes': return app('solicitudes', can('Oficina: solicitudes') ? viewSolicitudes() : denied('las solicitudes'));
    case h === 'reportes': return app('reportes', can('Reportes administrativos') ? viewStub(...STUBS.reportes).replace('class="page-head"', 'class="page-head" style="margin:-40px -24px 0"') : denied('los reportes administrativos'));
    case h === 'admin': return app('admin', ['superadmin', 'director', 'coordinador'].includes(S.role) ? viewAdmin() : denied('el panel administrativo'));
    default: return pub('inicio', viewInicio());
  }
}

let lastRoute = null;
function render(opts = {}) {
  const r = resolve();
  const y = window.scrollY;
  root.innerHTML = r.env === 'pub' ? publicShell(r.name, r.html) : appShell(r.name, r.html, r.bare);
  document.title = `${TITLES[r.name] || 'LeaderSource'} · LeaderSource`;
  // restaurar valores de campos
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  set('cat-q', S.cat.q); set('d-q', S.doc.q); set('d-c', S.doc.cat); set('d-v', S.doc.vis); set('d-s', S.doc.status);
  const ln = r.html.includes('id="quiz"') ? location.hash.replace('#leccion-', '') : null;
  if (ln) applyQuiz(ln);
  if (opts.focus) { const e = document.getElementById(opts.focus); if (e) e.focus(); window.scrollTo(0, y); }
  else if (!opts.nav) { window.scrollTo(0, y); }
  else if (opts.nav) { const h1 = root.querySelector('h1'); window.scrollTo(0, 0); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); } }
  lastRoute = r.name;
}
window.addEventListener('hashchange', () => render({ nav: true }));

/* Cuestionario */
function applyQuiz(ln) {
  const res = S.quiz[ln]; if (!res) return;
  res.ans.forEach((a, i) => { const inp = root.querySelector(`input[name="q${i}"][value="${a}"]`); if (inp) inp.checked = true; const q = document.getElementById('q' + i); if (q) q.classList.add(a === QUIZ[i].a ? 'right' : 'wrong'); });
  const out = document.getElementById('quiz-out'); if (out) out.textContent = `Resultado: ${res.score} %. ${res.score >= 70 ? 'Aprobado.' : 'No alcanzó el 70 %. Revise las respuestas e inténtelo de nuevo.'}`;
}
function submitQuiz() {
  const ln = location.hash.replace('#leccion-', '');
  const ans = QUIZ.map((q, i) => { const c = root.querySelector(`input[name="q${i}"]:checked`); return c ? +c.value : -1; });
  const out = document.getElementById('quiz-out');
  if (ans.includes(-1)) { out.textContent = 'Responda las tres preguntas antes de comprobar.'; return; }
  const score = Math.round(100 * ans.filter((a, i) => a === QUIZ[i].a).length / QUIZ.length);
  S.quiz[ln] = { score, ans }; store.set('ls-quiz', S.quiz);
  if (score >= 70) { S.done[ln] = true; store.set('ls-done', S.done); }
  render({ focus: 'quiz-go' });
}

/* Eventos delegados */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-doc], [data-req]'); if (!t) return;
  if (t.matches('[data-skip]')) { e.preventDefault(); const m = document.getElementById('main'); m.setAttribute('tabindex', '-1'); m.focus(); return; }
  if (t.matches('[data-filter]')) { const [k, v] = t.dataset.filter.split(':'); S.cat = { q: '', stage: [], action: [], format: [], level: [], mod: [] }; S.cat[k] = [v]; return; }
  if (t.matches('[data-clear]')) { S.cat = { q: '', stage: [], action: [], format: [], level: [], mod: [] }; render({ focus: 'cat-q' }); return; }
  if (t.matches('[data-doc]')) { S.doc.sel = +t.dataset.doc; document.getElementById('doc-table').innerHTML = docTable(); document.getElementById('doc-panel').innerHTML = docPanel(); return; }
  if (t.matches('[data-req]')) { S.req.sel = t.dataset.req; document.getElementById('req-table').innerHTML = reqTable(); document.getElementById('req-panel').innerHTML = reqPanel(); return; }
  if (t.matches('[data-tab]')) { S.tab = t.dataset.tab; render({ focus: 't-' + S.tab }); return; }
  if (t.matches('#toggle-done')) { const k = location.hash.replace('#leccion-', ''); S.done[k] = !S.done[k]; store.set('ls-done', S.done); render({ focus: 'toggle-done' }); return; }
  if (t.matches('[data-role]')) { S.role = t.dataset.role; store.set('ls-role', S.role); location.hash = t.dataset.go; return; }
  if (t.matches('[data-theme-toggle]')) { const n = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store.set('ls-theme', n); const b = root.querySelector('[data-theme-toggle]'); render({ focus: null }); const nb = root.querySelector('[data-theme-toggle]'); if (nb) nb.focus(); return; }
  if (t.matches('#menu-btn')) { const nav = document.getElementById('nav'); const o = nav.classList.toggle('open'); t.setAttribute('aria-expanded', o); return; }
  if (t.matches('[data-drawer-open]')) { document.getElementById('sidebar').classList.add('open'); t.setAttribute('aria-expanded', 'true'); const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim'; sc.setAttribute('data-drawer-close', ''); document.body.appendChild(sc); return; }
  if (t.matches('[data-drawer-close]')) { const s = document.getElementById('sidebar'); if (s) s.classList.remove('open'); const sc = document.getElementById('scrim'); if (sc) sc.remove(); return; }
  const sc = e.target.closest('#scrim'); if (sc) { document.getElementById('sidebar').classList.remove('open'); sc.remove(); return; }
  if (t.matches('.nav a, .sidebar a')) { const n = document.getElementById('nav'); if (n) n.classList.remove('open'); const sc2 = document.getElementById('scrim'); if (sc2) sc2.remove(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cat-q') { S.cat.q = t.value; document.getElementById('cat-results').innerHTML = catResults(); }
  if (t.id === 'd-q') { S.doc.q = t.value; document.getElementById('doc-table').innerHTML = docTable(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-cat]')) { const a = S.cat[t.dataset.cat]; const i = a.indexOf(t.value); if (t.checked && i < 0) a.push(t.value); if (!t.checked && i >= 0) a.splice(i, 1); document.getElementById('cat-results').innerHTML = catResults(); }
  if (t.id === 'd-c') { S.doc.cat = t.value; document.getElementById('doc-table').innerHTML = docTable(); }
  if (t.id === 'd-v') { S.doc.vis = t.value; document.getElementById('doc-table').innerHTML = docTable(); }
  if (t.id === 'd-s') { S.doc.status = t.value; document.getElementById('doc-table').innerHTML = docTable(); }
  if (t.id === 'role-sel') { S.role = t.value; store.set('ls-role', S.role); S.doc.sel = null; S.req.sel = null; render({ focus: 'role-sel' }); }
});
document.addEventListener('submit', e => { if (e.target.id === 'quiz') { e.preventDefault(); submitQuiz(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const s = document.getElementById('sidebar'); if (s && s.classList.contains('open')) { s.classList.remove('open'); const sc = document.getElementById('scrim'); if (sc) sc.remove(); } } });

(function init() {
  const th = store.get('ls-theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
  render({});
})();
</script>
