# Ejemplo de despliegue con Docker Compose. NO se pudo ejecutar donde se escribió (sin demonio de Docker): revíselo antes de usarlo.
#
# Piezas que NO están aquí y deben existir:
#   · PostgreSQL 16 gestionado (con los roles ls_owner y ls_app creados con db/bootstrap.sql y copias de seguridad del proveedor).
#   · Almacenamiento S3 (cuatro buckets: ls-private, ls-public, ls-quarantine, ls-scorm) con versionado en ls-private.
#   · ClamAV (clamd) accesible por TCP. Referencia más abajo, comentada.
#   · Un proxy inverso con TLS con DOS nombres de host que apunten a este servicio web: APP_URL y CONTENT_URL (ver deploy/nginx.conf.example).
#     APP_URL=https://campus.ejemplo.org   CONTENT_URL=https://contenido.ejemplo.org
#     El código de los paquetes SCORM/xAPI corre en CONTENT_URL, un origen distinto, sin cookies de sesión.
#
# Uso:
#   cp .env.production.example .env.production   (rellene; NO lo suba al repositorio)
#   docker compose -f docker-compose.prod.example.yml --env-file .env.production run --rm check-env
#   docker compose -f docker-compose.prod.example.yml --env-file .env.production up -d
name: leadersource

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?rol ls_app}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?32 bytes en base64}
  XAPI_ACTOR_KEY: ${XAPI_ACTOR_KEY:?32 bytes en base64, no se rota}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:?0 sin proxy, 1 con proxy inverso}
  APP_URL: ${APP_URL:?https://...}
  CONTENT_URL: ${CONTENT_URL:?https://...}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-ls-private}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-ls-public}
  S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-ls-quarantine}
  S3_BUCKET_SCORM: ${S3_BUCKET_SCORM:-ls-scorm}
  SCAN_DRIVER: clamav
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  SCORM_MAX_PACKAGE_MB: ${SCORM_MAX_PACKAGE_MB:-200}
  XAPI_LRS_ENDPOINT: ${XAPI_LRS_ENDPOINT:-}
  XAPI_LRS_KEY: ${XAPI_LRS_KEY:-}
  XAPI_LRS_SECRET: ${XAPI_LRS_SECRET:-}
  XAPI_FORWARD_SECRET: ${XAPI_FORWARD_SECRET:-}
  APP_VERSION: ${APP_VERSION:-}
  GIT_SHA: ${GIT_SHA:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # Comprobación previa: sale con código 1 si la configuración es incoherente.
  check-env:
    image: leadersource-ops:${TAG:-latest}
    command: ["node", "scripts/check-env.mjs"]
    environment: *app-env
    profiles: ["ops"]

  # Migraciones: de un solo uso, con el rol DUEÑO (ls_owner). Debe terminar bien antes de arrancar la aplicación.
  migrate:
    image: leadersource-ops:${TAG:-latest}
    command: ["node", "db/migrate.mjs"]
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?rol ls_owner}
    restart: "no"

  web:
    image: leadersource-web:${TAG:-latest}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment: *app-env
    ports: ["127.0.0.1:3000:3000"]          # solo el proxy inverso del mismo servidor llega aquí
    restart: unless-stopped
    read_only: true                          # el contenedor no escribe en disco: los archivos van a S3
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources: { limits: { memory: 1g } }  # una importación de paquete grande necesita memoria: ajuste con SCORM_MAX_PACKAGE_MB
    # El HEALTHCHECK de la imagen consulta /api/health. Para el balanceador use /api/ready (solo red interna).
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  # Mantenimiento periódico (sesiones caducadas, invitaciones, informes). Dispárelo desde cron del host o un CronJob:
  #   docker compose ... run --rm maintenance            (simulacro)
  #   docker compose ... run --rm maintenance node scripts/maintenance.mjs --apply
  maintenance:
    image: leadersource-ops:${TAG:-latest}
    command: ["node", "scripts/maintenance.mjs"]
    environment: { DATABASE_URL: "${DATABASE_URL:?}" }
    profiles: ["ops"]

  # Copia de seguridad de la base (la imagen ops incluye pg_dump 16 y age). Programe con cron del host; guarde fuera del servidor.
  backup:
    image: leadersource-ops:${TAG:-latest}
    command: ["scripts/backup-db.sh"]
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?}
      BACKUP_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}     # clave PÚBLICA de age; la privada se guarda fuera del servidor
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes: ["./backups:/backups"]
    profiles: ["ops"]

  # --- Referencias para pruebas o instalaciones sin servicios gestionados (no use claves de ejemplo en producción) ---
  # clamav:
  #   image: clamav/clamav:stable
  #   # clamd.conf: StreamMaxLength y MaxFileSize >= SCORM_MAX_PACKAGE_MB (por defecto 25M no basta para paquetes grandes)
  #   restart: unless-stopped
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   volumes: [miniodata:/data]
