# Servicios de desarrollo local: PostgreSQL, almacenamiento compatible con S3 (MinIO) y antivirus (ClamAV).
# NO se pudo probar en la sesión donde se escribió (sin demonio de Docker). Revíselo al usarlo por primera vez.
#
#   docker compose up -d
#   psql "postgres://postgres:postgres@localhost:5432/postgres" -v owner_pw="'owner_local_pw'" -v app_pw="'app_local_pw'" -f db/bootstrap.sql
#   DATABASE_OWNER_URL=postgres://ls_owner:owner_local_pw@localhost:5432/leadersource_dev npm run db:migrate
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-setup:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/ls-private local/ls-public local/ls-quarantine local/ls-scorm;
      mc version enable local/ls-private;
      exit 0;"
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
volumes: { pgdata: {}, miniodata: {} }
